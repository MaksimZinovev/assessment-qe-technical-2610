name: secrets

# Central secret-scanning enforcement: full-history gitleaks detect on every
# push and PR. Red check = fail — covers `--no-verify` bypasses and forks
# (the local layer is .githooks/pre-commit, wired by scripts/init.sh).
# .env (public demo creds only, no real secrets by design) is allowlisted in
# .gitleaks.toml.
on: [push, pull_request]

jobs:
  gitleaks:
    name: gitleaks detect (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deterministic full-history scan every run — the differential
          # push-scan breaks on fresh repo histories (base revision not
          # resolvable → git stderr → exit 1 with zero leaks).
          GITLEAKS_LOG_OPTS: "--all"