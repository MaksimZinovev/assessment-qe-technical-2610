name: ci

# Test CI. Dispatch-only per locked plan — the reviewer/user triggers runs from
# the Actions tab ("Run workflow") or `gh workflow run`.
# CI inherits retries: 1 from playwright.config.ts — permanent for this
# assessment (user decision, 2026-10-29). Do NOT raise it here.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Playwright project to run"
        type: choice
        options: [all, api, ui]
        default: all
      grep:
        description: "Optional --grep title filter"
        type: string
        default: ""

jobs:
  test:
    name: lint + typecheck + ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium + system deps)
        run: npx playwright install --with-deps chromium

      - name: Lint (Biome, Playwright domain active)
        run: ./node_modules/.bin/biome check .

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Playwright tests
        env:
          PW_PROJECT: ${{ inputs.project }}
          PW_GREP: ${{ inputs.grep }}
        run: |
          PROJECT_FLAG=""
          [ "$PW_PROJECT" != "all" ] && PROJECT_FLAG="--project=$PW_PROJECT"
          if [ -n "$PW_GREP" ]; then
            npx playwright test $PROJECT_FLAG --grep="$PW_GREP"
          else
            npx playwright test $PROJECT_FLAG
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7